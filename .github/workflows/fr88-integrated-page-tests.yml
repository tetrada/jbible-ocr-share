name: JBible complete page scan regression
on:
  push:
    paths:
      - 'tools/fr88_integrated_page.py'
      - 'tools/fr88_page_layout_core.py'
      - 'tools/fr88_integrated_reference_rules.py'
      - 'tools/fr88_integrated_human_replay.py'
      - 'tools/test_fr88_integrated_human_replay.py'
      - 'tools/fr88_v2_normalize.py'
      - 'fr88_integrated_v1/human_exception_reviews.json'
      - 'tools/test_fr88_integrated_reference_rules.py'
      - 'training/fr88_integrated_editorial_rules.json'
      - 'tools/fr88_integrated_header_prompt.txt'
      - 'tools/fr88_integrated_verse_prompt.txt'
      - 'tools/fr88_integrated_margin_prompt.txt'
      - 'tools/test_fr88_integrated_page.py'
      - 'tools/test_fr88_page_layout_core.py'
      - 'tools/run_fr88_integrated_page.sh'
      - '.github/workflows/fr88-integrated-page-tests.yml'
  workflow_dispatch:
jobs:
  full-page-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local Pillow dependency
        run: python -m pip install pillow
      - name: Check all Python script syntax
        run: python -m py_compile tools/fr88_integrated_page.py tools/fr88_page_layout_core.py tools/test_fr88_page_layout_core.py tools/test_fr88_integrated_page.py tools/fr88_v2_normalize.py tools/fr88_link_edges.py tools/fr88_integrated_reference_rules.py tools/test_fr88_integrated_reference_rules.py tools/fr88_integrated_human_replay.py tools/test_fr88_integrated_human_replay.py
      - name: Verify physical verse interval mapping and page header direction
        run: cd tools && python test_fr88_page_layout_core.py
      - name: Test editorial conventions and independent comma-separated destinations
        run: cd tools && python test_fr88_integrated_reference_rules.py
      - name: Apply and verify all 24 actual human-reviewed exceptions
        run: cd tools && python test_fr88_integrated_human_replay.py
      - name: Verify independent destination splitting and scanner JSON
        run: cd tools && python test_fr88_integrated_page.py
      - name: Verify VPS runner shell syntax
        run: bash -n tools/run_fr88_integrated_page.sh
