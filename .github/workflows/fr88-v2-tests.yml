name: FR88 v2 parser checks
on:
  push:
    paths:
      - "tools/fr88_v2_normalize.py"
      - "tools/fr88_v2_ocr.py"
      - "tools/fr88_v2_finalize.py"
      - "tools/finalize_fr88_32_500.sh"
      - "tools/run_fr88_v2.sh"
      - "tools/start_fr88_v2_32_500.sh"
      - ".github/workflows/fr88-v2-tests.yml"
      - "catalog.csv"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile new OCR and parser
        run: python -m py_compile tools/fr88_v2_normalize.py tools/fr88_v2_ocr.py tools/fr88_v2_finalize.py
      - name: Validate shell launch scripts
        run: bash -n tools/run_fr88_v2.sh tools/start_fr88_v2_32_500.sh tools/finalize_fr88_32_500.sh
      - name: Compile embedded bootstrap Python
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/start_fr88_v2_32_500.sh').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.startswith("  python3 - ") and "<<'PY'" in line)
          end = next(i for i in range(start + 1, len(source)) if source[i] == 'PY')
          compile(chr(10).join(source[start+1:end]), '<bootstrap-python>', 'exec')
          print('Embedded Python: syntax OK')
          PY
      - name: Verify user-provided notation examples
        run: python tools/fr88_v2_normalize.py --catalog catalog.csv --self-test
