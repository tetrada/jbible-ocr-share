name: FR88 v3 offline typography pilot tests
on:
  push:
    paths:
      - "tools/fr88_v3_pilot.py"
      - "tools/fr88_v3_typography_prompt.txt"
      - "tools/test_fr88_v3_pilot.py"
      - "tools/run_fr88_v3_pilot.sh"
      - "tools/install_fr88_v3_pilot.sh"
      - "tools/fr88_v2_normalize.py"
      - "tools/fr88_v2_ocr.py"
      - ".github/workflows/fr88-v3-pilot-tests.yml"
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Python syntax
        run: python -m py_compile tools/fr88_v3_pilot.py tools/test_fr88_v3_pilot.py
      - name: Shell syntax
        run: bash -n tools/run_fr88_v3_pilot.sh tools/install_fr88_v3_pilot.sh
      - name: Offline regression (no API calls)
        run: cd tools && python test_fr88_v3_pilot.py
